# NVR Space — hosting config for Render.
# Zero npm dependencies, so there is no build step and no install.
#
# PLAN: free ($0). Read the trade-off below before switching to "starter".
#
#   What free gives you: the site runs 24/7 at a permanent URL.
#   What free costs you: the container's disk is EPHEMERAL, so data/db.json is
#   WIPED ON EVERY REDEPLOY — every account and every session disappears.
#   It also idles out after ~15 minutes and takes ~1 min to wake on the next
#   request, so the first visitor after a quiet spell waits a moment.
#
#   A persistent disk (which fixes the wiped accounts) requires the paid
#   "starter" plan ($7/mo). That is why there is NO disk block here — Render
#   refuses to deploy a blueprint that asks for a disk on a free plan.
#   To pay for durability later: set plan: starter, add DATA_DIR=/var/data and
#   the disk block below, then redeploy.
services:
  - type: web
    name: nvr-space
    runtime: node
    plan: free
    buildCommand: ""            # nothing to build — no npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: ""               # Render injects this; the server reads it
      # ---- fill these two in, Render will not guess them ----
      - key: PUBLIC_ORIGIN
        sync: false
        # e.g. https://nvr-space.onrender.com
        # WITHOUT THIS, password-reset and verification emails point at
        # localhost and the links are dead on arrival.
      - key: RESEND_API_KEY
        sync: false
        # from resend.com (free tier, ~3k emails/mo).
        # WITHOUT THIS the app still works, but email verification and
        # password reset only complete for you locally — dev mode is
        # loopback-only on purpose, because returning a live reset link to
        # the public would be an account-takeover hole.
      - key: MAIL_FROM
        value: NVR Space <no-reply@yourdomain.com>
      - key: COOKIE_SECURE
        value: "1"              # the host serves HTTPS
      - key: REQUIRE_VERIFICATION
        value: "0"              # "1" blocks sign-in until the email is confirmed
      # No DATA_DIR on the free plan: there is nowhere persistent to point it.
      # Leave it unset — accounts then live in ./data and reset on redeploy.

# ---- paid-plan alternative (requires plan: starter, ~$7/mo) ----
#     disk:
#       name: nvr-data
#       mountPath: /var/data
#       sizeGB: 1